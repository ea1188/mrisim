name: Build release binaries

# Builds standalone, no-Python-required executables for Windows, macOS and Linux
# and attaches them to the GitHub release. Triggers when a version tag is pushed,
# or manually (Run workflow) against an existing tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach binaries to (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: MRISim-linux.tar.gz
          - os: windows-latest
            artifact: MRISim-windows.exe
          - os: macos-latest
            artifact: MRISim-macos.zip
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # PyQt6 is imported during PyInstaller's analysis, so the Linux runner
      # needs the Qt/OpenGL runtime libraries present at build time.
      - name: Install Linux Qt libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pyqt6 pydicom nibabel pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean mrisim.spec

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf MRISim-linux.tar.gz -C dist MRISim

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/MRISim.app MRISim-macos.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Move-Item dist/MRISim.exe MRISim-windows.exe

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ matrix.artifact }}
