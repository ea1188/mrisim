name: Web lint (ESLint)

# Fast static analysis of the browser build's JavaScript (web/). Catches
# undefined variables, typos, duplicate keys, unreachable code, etc. on every
# PR — the things the headless-browser smoke test can't see (and would only
# surface slowly, if at all).
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "eslint.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-lint.yml"
  pull_request:
    paths:
      - "web/**"
      - "eslint.config.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-lint.yml"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint
