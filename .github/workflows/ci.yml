name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install headless Qt system libraries
        # The GUI smoke tests boot PyQt6 under QT_QPA_PLATFORM=offscreen, which
        # still needs these shared libraries (libEGL.so.1 et al.) on a bare runner.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov mypy ruff

      - name: Lint (ruff)
        run: python -m ruff check src/ tests/

      - name: Type check (mypy)
        run: python -m mypy src/

      - name: Run tests
        run: python -m pytest tests/ --tb=short -q

      - name: Coverage report
        run: python -m pytest tests/ --cov=src --cov-report=term-missing --tb=no -q
