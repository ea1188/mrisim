name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install headless Qt system libraries
        # The GUI smoke tests boot PyQt6 under QT_QPA_PLATFORM=offscreen, which
        # still needs these shared libraries (libEGL.so.1 et al.) on a bare runner.
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check src/ tests/

      - name: Type check (mypy)
        run: python -m mypy src/

      - name: Run tests (parallel, with coverage regression floor)
        # One pass runs the suite across all cores (xdist) AND enforces the
        # coverage floor — failing if total coverage drops below it guards
        # against new untested code. Current total ~87% (non-GUI engine ~94%,
        # GUI ~74%); the floor sits a couple of points below so it catches
        # regressions without being brittle to platform line-count noise.
        # --dist loadfile keeps each test file on one worker in file order, so
        # session-scoped stateful fixtures (the GUI smoke window) behave exactly
        # as in a serial run — parallelism across files only, no ordering flakes.
        run: python -m pytest tests/ -n auto --dist loadfile --cov=src --cov-report=term-missing --cov-fail-under=85 --tb=short -q
