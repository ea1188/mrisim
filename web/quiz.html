<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MRISim · Quiz</title>
  <!-- Warm the Pyodide CDN connection during page parse (see simulator.html). -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* ---- Quiz mode (read-the-scan self-test) — flat/crisp design system (theme.css) ---- */
    #qz-root { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    #qz-head {
      display: flex; align-items: center; gap: 14px; padding: 0 clamp(12px,4vw,18px); height: 52px;
      border-bottom: 1px solid var(--line); background: var(--bg-2);
    }
    #qz-head h1 { font-size: 15px; margin: 0; color: var(--text); font-weight: 700; letter-spacing: -.2px; }
    #qz-head .spacer { flex: 1; }
    #qz-head a { color: var(--muted); text-decoration: none; font-size: 13px; margin-left: 16px; transition: color .15s; }
    #qz-head a:hover { color: var(--text); }
    #qz-score { color: var(--muted); font-size: 13px; font-family: var(--mono); font-variant-numeric: tabular-nums; }
    #qz-body { display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 18px; }
    #qz-card { width: min(720px, 96vw); background: var(--panel); border: 1px solid var(--line);
      border-radius: 2px; padding: 16px 18px 18px; }
    #qz-progress { color: var(--dim); font-family: var(--mono); font-size: 11px; letter-spacing: .06em; margin: 0 0 8px; }
    #qz-imgwrap { background: #04060a; border: 1px solid var(--line); border-radius: 2px;
      display: flex; align-items: center; justify-content: center; min-height: 320px; }
    #qz-img { max-width: 100%; max-height: 52vh; image-rendering: auto; display: none; }
    #qz-pair { display: none; gap: 8px; width: 100%; justify-content: center; }
    #qz-pair figure { margin: 0; flex: 1 1 0; max-width: 50%; text-align: center; }
    #qz-pair img { max-width: 100%; max-height: 46vh; display: block; margin: 0 auto; }
    #qz-pair figcaption { color: var(--muted); font-family: var(--mono); font-size: 11px; font-weight: 600; margin-top: 5px; letter-spacing: .1em; }
    #qz-imgmsg { color: var(--dim); font-size: 13px; }
    #qz-prompt { color: var(--text); font-size: 15px; font-weight: 600; margin: 14px 0 10px; line-height: 1.4; }
    #qz-options { display: grid; gap: 8px; }
    .qz-opt { position: relative; text-align: left; background: var(--bg-2); color: var(--text); border: 1px solid var(--line-2);
      border-radius: 2px; padding: 10px 12px; font-size: 14px; cursor: pointer; transition: border-color .14s, background .14s; }
    .qz-opt:hover:not(:disabled) { border-color: var(--accent-deep); }
    .qz-opt:disabled { cursor: default; }
    /* A text marker so correct/wrong reads without relying on border colour. */
    .qz-opt.correct, .qz-opt.wrong { padding-right: 84px; }
    .qz-opt.correct { border-color: #3f8f5a; background: #14261a; color: #d7f5dd; }
    .qz-opt.wrong { border-color: #8f3f3f; background: #261414; color: #f5d7d7; }
    .qz-opt.correct::after, .qz-opt.wrong::after {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      font-family: var(--mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
    .qz-opt.correct::after { content: "correct"; color: #7fe0a0; }
    .qz-opt.wrong::after { content: "your pick"; color: #f0a0a0; }
    #qz-feedback { margin-top: 12px; font-size: 13.5px; line-height: 1.5; color: #c4cad2; display: none; }
    #qz-feedback b.ok { color: var(--ok); } #qz-feedback b.no { color: var(--warn); }
    #qz-next { margin-top: 14px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 2px;
      padding: 9px 20px; font-weight: 600; cursor: pointer; display: none; }
    #qz-summary { text-align: center; display: none; }
    #qz-summary h2 { color: var(--text); font-size: 22px; margin: 8px 0; letter-spacing: -.02em; }
    #qz-summary p { color: #c4cad2; }
    #qz-restart, #qz-review { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 2px;
      padding: 9px 22px; font-weight: 600; cursor: pointer; margin: 10px 6px 0; }
    #qz-next:hover, #qz-restart:hover, #qz-review:hover { background: #7cc0f4; }
    #qz-menu { text-align: center; padding: 6px 0 4px; }
    #qz-menu h2 { color: var(--text); font-size: 17px; margin: 4px 0 16px; }
    #qz-topics { display: grid; gap: 10px; max-width: 440px; margin: 0 auto; }
    .qz-topic { background: var(--bg-2); color: var(--text); border: 1px solid var(--line-2); border-radius: 2px;
      padding: 13px 15px; font-size: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; transition: border-color .14s, background .14s; }
    .qz-topic:hover { border-color: var(--accent-deep); background: var(--panel-2); }
    .qz-topic .n { color: var(--dim); font-family: var(--mono); font-size: 12px; font-variant-numeric: tabular-nums; }
    #qz-topics-back { background: transparent; color: #c4cad2; border: 1px solid var(--line-2);
      border-radius: 2px; padding: 9px 16px; font-weight: 600; cursor: pointer; margin: 10px 6px 0; }
    #qz-topics-back:hover { border-color: var(--accent-deep); }
    @media (max-width: 640px) { #qz-root { height: auto; min-height: 100dvh; } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-card">
      <img class="logo" src="logo.png" alt="MRISim logo" />
      <h1>Quiz</h1>
      <p id="splash-status">Starting…</p>
      <div class="bar"><div id="splash-bar"></div></div>
      <p class="splash-note">Runs the real Python engine in your browser via Pyodide.
        First load downloads ~30–50&nbsp;MB (cached afterwards).</p>
    </div>
  </div>

  <div id="qz-root" hidden>
    <header id="qz-head">
      <h1>MRISim · MRI Quizzes</h1>
      <span class="spacer"></span>
      <span id="qz-score" role="status" aria-live="polite" aria-atomic="true">Score 0 / 0</span>
      <a href="protocol.html">Protocol</a>
      <a href="simulator.html">Simulator</a>
      <a href="index.html">Home</a>
    </header>

    <div id="qz-body">
      <div id="qz-card">
        <div id="qz-menu">
          <h2>MRI Quizzes: choose a topic</h2>
          <div id="qz-topics"></div>
        </div>
        <p id="qz-progress"></p>
        <div id="qz-imgwrap">
          <div id="qz-pair">
            <figure><img id="qz-imgA" alt="Scan A" /><figcaption>A</figcaption></figure>
            <figure><img id="qz-imgB" alt="Scan B" /><figcaption>B</figcaption></figure>
          </div>
          <img id="qz-img" alt="Quiz scan" />
          <span id="qz-imgmsg" role="status" aria-live="polite">Rendering…</span>
        </div>
        <p id="qz-prompt"></p>
        <div id="qz-options" role="group" aria-label="Answer choices"></div>
        <div id="qz-feedback" role="status" aria-live="polite"></div>
        <button id="qz-next" type="button">Next ▸</button>

        <div id="qz-summary">
          <h2 id="qz-summary-score"></h2>
          <p id="qz-summary-msg"></p>
          <button id="qz-review" type="button" style="display:none">Review missed</button>
          <button id="qz-restart" type="button">↻ Try again</button>
          <button id="qz-topics-back" type="button">← Choose another topic</button>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="accounts.js"></script>
  <script src="quiz.js"></script>
</body>
</html>
