<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MRISim · Quiz</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    /* ---- Quiz mode (read-the-scan self-test) ---- */
    #qz-root { display: grid; grid-template-rows: auto 1fr; height: 100vh; }
    #qz-head {
      display: flex; align-items: center; gap: 14px; padding: 8px 14px;
      border-bottom: 1px solid #2a323c; background: #11151b;
    }
    #qz-head h1 { font-size: 15px; margin: 0; color: #e6edf3; font-weight: 600; }
    #qz-head .spacer { flex: 1; }
    #qz-head a { color: #6ea7df; text-decoration: none; font-size: 13px; margin-left: 14px; }
    #qz-score { color: #c4ccd6; font-size: 13px; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    #qz-body { display: flex; align-items: flex-start; justify-content: center; overflow: auto; padding: 18px; }
    #qz-card { width: min(720px, 96vw); background: #141a21; border: 1px solid #232c36;
      border-radius: 2px; padding: 16px 18px 18px; }
    #qz-progress { color: #8b95a1; font-size: 12px; margin: 0 0 8px; }
    #qz-imgwrap { background: #05080b; border: 1px solid #232c36; border-radius: 2px;
      display: flex; align-items: center; justify-content: center; min-height: 320px; }
    #qz-img { max-width: 100%; max-height: 52vh; image-rendering: auto; display: none; }
    #qz-pair { display: none; gap: 8px; width: 100%; justify-content: center; }
    #qz-pair figure { margin: 0; flex: 1 1 0; max-width: 50%; text-align: center; }
    #qz-pair img { max-width: 100%; max-height: 46vh; display: block; margin: 0 auto; }
    #qz-pair figcaption { color: #9aa6b2; font-size: 12px; font-weight: 700; margin-top: 4px; letter-spacing: .04em; }
    #qz-imgmsg { color: #7c8794; font-size: 13px; }
    #qz-prompt { color: #e6edf3; font-size: 15px; font-weight: 600; margin: 14px 0 10px; line-height: 1.35; }
    #qz-options { display: grid; gap: 8px; }
    .qz-opt { text-align: left; background: #1b2530; color: #d7dee8; border: 1px solid #2f4358;
      border-radius: 2px; padding: 10px 12px; font-size: 14px; cursor: pointer; }
    .qz-opt:hover:not(:disabled) { border-color: #3f6f9c; background: #20303f; }
    .qz-opt:disabled { cursor: default; }
    .qz-opt.correct { border-color: #3fb950; background: #16301d; color: #d7f5dd; }
    .qz-opt.wrong { border-color: #d9534f; background: #311818; color: #f5d7d7; }
    #qz-feedback { margin-top: 12px; font-size: 13.5px; line-height: 1.4; color: #c4ccd6; display: none; }
    #qz-feedback b.ok { color: #3fb950; } #qz-feedback b.no { color: #e5736f; }
    #qz-next { margin-top: 14px; background: #4385cc; color: #081019; border: 0; border-radius: 2px;
      padding: 9px 20px; font-weight: 600; cursor: pointer; display: none; }
    #qz-summary { text-align: center; display: none; }
    #qz-summary h2 { color: #e6edf3; font-size: 22px; margin: 8px 0; }
    #qz-summary p { color: #c4ccd6; }
    #qz-restart, #qz-review { background: #4385cc; color: #081019; border: 0; border-radius: 2px;
      padding: 9px 22px; font-weight: 600; cursor: pointer; margin: 10px 6px 0; }
    #qz-next:hover, #qz-restart:hover, #qz-review:hover { background: #4f93d6; }
    #qz-menu { text-align: center; padding: 6px 0 4px; }
    #qz-menu h2 { color: #e6edf3; font-size: 17px; margin: 4px 0 16px; }
    #qz-topics { display: grid; gap: 10px; max-width: 440px; margin: 0 auto; }
    .qz-topic { background: #1b2530; color: #e6edf3; border: 1px solid #2f4358; border-radius: 2px;
      padding: 13px 15px; font-size: 15px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .qz-topic:hover { border-color: #3f6f9c; background: #20303f; }
    .qz-topic .n { color: #8b95a1; font-size: 12px; font-variant-numeric: tabular-nums; }
    #qz-topics-back { background: transparent; color: #c4ccd6; border: 1px solid #2f4358;
      border-radius: 2px; padding: 9px 16px; font-weight: 600; cursor: pointer; margin: 10px 6px 0; }
    @media (max-width: 640px) { #qz-root { height: auto; min-height: 100dvh; } }
  </style>
</head>
<body>
  <div id="splash">
    <div class="splash-card">
      <img class="logo" src="logo.png" alt="MRISim logo" />
      <h1>Quiz</h1>
      <p id="splash-status">Starting…</p>
      <div class="bar"><div id="splash-bar"></div></div>
      <p class="splash-note">Runs the real Python engine in your browser via Pyodide.
        First load downloads ~30–50&nbsp;MB (cached afterwards).</p>
    </div>
  </div>

  <div id="qz-root" hidden>
    <header id="qz-head">
      <h1>MRISim · MRI Quizzes</h1>
      <span class="spacer"></span>
      <span id="qz-score">Score 0 / 0</span>
      <a href="protocol.html">Protocol</a>
      <a href="simulator.html">Simulator</a>
      <a href="index.html">Home</a>
    </header>

    <div id="qz-body">
      <div id="qz-card">
        <div id="qz-menu">
          <h2>MRI Quizzes — choose a topic</h2>
          <div id="qz-topics"></div>
        </div>
        <p id="qz-progress"></p>
        <div id="qz-imgwrap">
          <div id="qz-pair">
            <figure><img id="qz-imgA" alt="Scan A" /><figcaption>A</figcaption></figure>
            <figure><img id="qz-imgB" alt="Scan B" /><figcaption>B</figcaption></figure>
          </div>
          <img id="qz-img" alt="Quiz scan" />
          <span id="qz-imgmsg">Rendering…</span>
        </div>
        <p id="qz-prompt"></p>
        <div id="qz-options"></div>
        <div id="qz-feedback"></div>
        <button id="qz-next" type="button">Next ▸</button>

        <div id="qz-summary">
          <h2 id="qz-summary-score"></h2>
          <p id="qz-summary-msg"></p>
          <button id="qz-review" type="button" style="display:none">Review missed</button>
          <button id="qz-restart" type="button">↻ Try again</button>
          <button id="qz-topics-back" type="button">← Choose another topic</button>
        </div>
      </div>
    </div>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
