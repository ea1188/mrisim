<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MRISim — reference library</title>
  <meta name="description" content="A deep, searchable MRI reference: short question-and-answer entries across physics, sequences, artifacts and safety. Part of the paid course." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* Reference library: consumes the shared design system (theme.css). Every selector here
       is a hook reference.js renders into — restyled to the flat/crisp system, never renamed. */
    body { height: 100%; }

    /* Top app bar (blurred, sticky) — matches course.html */
    .top { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 clamp(14px,4vw,22px);
      background: rgba(7,9,12,.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
      position: sticky; top: 0; z-index: 10; }
    .top img { width: 26px; height: 26px; }
    .top h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
    .top .badge { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--accent); border: 1px solid var(--line-2); border-radius: 2px; padding: 2px 9px; }
    .top .sp { flex: 1; }
    .top a, .top button { color: var(--muted); text-decoration: none; font: inherit; font-size: 13px;
      background: none; border: none; cursor: pointer; transition: color .15s; }
    .top a:hover, .top button:hover { color: var(--text); }
    .top .whoami { color: var(--muted); font-size: 12.5px; }

    /* Gate screens (sign-in / paywall / notices) — mirrors the course page. */
    .gate { max-width: 520px; margin: 8vh auto; padding: 0 18px; }
    .gate .card { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 26px; }
    .gate h2 { font-size: 19px; margin: 0 0 10px; }
    .gate p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 14px; }
    .gate label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
    .gate input { width: 100%; box-sizing: border-box; background: var(--bg-2); border: 1px solid var(--line-2);
      color: var(--text); border-radius: 2px; padding: 10px 12px; font: inherit; font-size: 14px; }
    .gate input:focus { outline: none; border-color: var(--accent); }
    .btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; background: var(--accent);
      color: var(--accent-ink); border: 1px solid transparent; border-radius: 2px; padding: 10px 16px;
      font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; transition: .16s; }
    .btn:hover { background: #7cc0f4; }
    .msg { font-size: 13px; margin-top: 12px; } .msg.ok { color: var(--ok); } .msg.err { color: var(--warn); }
    .linkout { color: var(--accent); text-decoration: none; }

    /* Reference layout: topic sidebar (with search) + entry list */
    .ref { display: grid; grid-template-columns: 288px 1fr; min-height: calc(100vh - 56px); }
    .rside { border-right: 1px solid var(--line); padding: 14px 0; overflow-y: auto; }
    .rsearch { padding: 0 14px 12px; }
    .rsearch input { width: 100%; box-sizing: border-box; background: var(--bg-2); border: 1px solid var(--line-2);
      color: var(--text); border-radius: 2px; padding: 9px 11px; font: inherit; font-size: 13px; }
    .rsearch input:focus { outline: none; border-color: var(--accent); }
    .rtopic { display: flex; align-items: center; width: 100%; text-align: left; background: none; border: none;
      cursor: pointer; color: #c4cad2; font: inherit; font-size: 13.5px; padding: 8px 16px; border-left: 2px solid transparent; transition: background .12s; }
    .rtopic:hover { background: var(--panel-2); }
    .rtopic.on { background: var(--panel-2); border-left-color: var(--accent); color: #fff; }
    .rtopic .rc { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }

    .rmain { padding: 26px clamp(20px,4vw,34px) 60px; max-width: 800px; }
    .rmain h2 { font-size: 22px; margin: 0 0 4px; }
    .rmain .lede { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
    .rmain .empty { color: var(--dim); font-size: 14px; margin-top: 18px; }
    .rgroup { margin: 0 0 10px; }
    .rgroup > h3 { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--dim); margin: 22px 0 8px; }
    .entry { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; margin-bottom: 8px; }
    .entry > .eh { display: flex; align-items: flex-start; gap: 10px; width: 100%; text-align: left; background: none;
      border: none; cursor: pointer; color: #e6ebf1; font: inherit; font-size: 14px; font-weight: 600; padding: 13px 16px; }
    .entry > .eh:hover { color: #fff; }
    .entry > .eh .car { flex: none; color: var(--dim); font-size: 10px; margin-top: 3px; transition: transform .12s; }
    .entry.open > .eh .car { transform: rotate(90deg); }
    .entry > .eh .et { flex: 1; }
    .entry .ebody { padding: 0 16px 14px; color: #c4cad2; font-size: 13.5px; line-height: 1.65; }
    .entry .ebody[hidden] { display: none; }
    .entry .ebody p { margin: 0 0 10px; } .entry .ebody ul { margin: 6px 0 10px 18px; padding: 0; }
    .entry .keypoints { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
    .entry .keypoints b { color: var(--muted); font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; display: block; margin-bottom: 7px; }
    .entry .keypoints li { color: #c4cad2; font-size: 13px; margin: 3px 0 3px 18px; }
    mark { background: rgba(93,176,239,.26); color: #e8edf3; border-radius: 2px; padding: 0 1px; }

    @media (max-width: 780px) { .ref { grid-template-columns: 1fr; } .rside { border-right: none; border-bottom: 1px solid var(--line); } }
  </style>
</head>
<body>
  <div class="top">
    <img src="logo.png" alt="" /><h1>MRISim</h1><span class="badge">Reference</span>
    <span class="sp"></span>
    <a href="course.html">Course</a>
    <a href="index.html">← Home</a>
    <span id="whoami" class="whoami" hidden></span>
  </div>
  <div id="reference-root" role="status" aria-live="polite">
    <div class="gate"><div class="card"><p>Loading…</p></div></div>
  </div>

  <script src="config.js"></script>
  <script src="accounts.js"></script>
  <script src="reference.js"></script>
</body>
</html>
