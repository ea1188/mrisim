<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MRISim — account</title>
  <meta name="description" content="Sign in to run an MRISim class: create a class, share a join code, and track your students' practice." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* Account / instructor page: consumes the shared design system (theme.css). Every selector
       here is a hook account.js renders into — restyled to the flat/crisp system, never renamed. */
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px clamp(16px,4vw,22px) 60px; }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
    .top img { width: 30px; height: 30px; }
    .top h1 { font-size: 20px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
    .top .sp { flex: 1; }
    .top a, .whoami button { color: var(--accent); text-decoration: none; font-size: 13px;
      background: none; border: none; cursor: pointer; font: inherit; transition: color .15s; }
    .top a:hover, .whoami button:hover { color: #8fc6f5; }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 22px; margin-bottom: 16px; }
    h2 { font-size: 15px; font-weight: 640; margin: 0 0 12px; }
    p.sub { color: var(--muted); font-size: 13.5px; line-height: 1.55; margin: 0 0 14px; }
    label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
    input[type=text], input[type=email] { width: 100%; box-sizing: border-box; background: var(--bg-2);
      border: 1px solid var(--line-2); color: var(--text); border-radius: 2px; padding: 10px 12px; font: inherit; font-size: 14px; }
    input:focus { outline: none; border-color: var(--accent); }
    .roles { display: flex; gap: 16px; margin-top: 6px; }
    .roles label { display: flex; align-items: center; gap: 6px; margin: 0; color: var(--text); font-size: 13px; cursor: pointer; }
    button.primary { display: inline-flex; align-items: center; gap: 8px; margin-top: 16px; background: var(--accent);
      color: var(--accent-ink); border: 1px solid transparent; border-radius: 2px; padding: 10px 16px;
      font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; transition: .16s; }
    button.primary:hover { background: #7cc0f4; }
    button.ghost { background: none; border: 1px solid var(--line-2); color: #cdd5df; border-radius: 2px;
      padding: 7px 12px; font: inherit; font-size: 12.5px; cursor: pointer; transition: .15s; }
    button.ghost:hover { border-color: var(--accent-deep); background: var(--panel-2); color: #fff; }
    .whoami { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
    .code { font-family: var(--mono); font-size: 15px; letter-spacing: 1px; color: var(--text); background: var(--bg-2);
      border: 1px solid var(--line-2); border-radius: 2px; padding: 3px 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--dim); font-family: var(--mono); font-weight: 600; font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; }
    td.num { font-variant-numeric: tabular-nums; }
    .muted { color: var(--dim); font-size: 12.5px; }
    .msg { font-size: 13px; margin-top: 12px; }
    .msg.ok { color: var(--ok); } .msg.err { color: var(--warn); }
    .classhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .classhead .grow { flex: 1; }
    .disclaimer { color: var(--dim); font-size: 11.5px; margin-top: 26px; line-height: 1.55; }
    .disclaimer a { color: var(--accent); text-decoration: none; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <img src="logo.png" alt="" />
      <h1>MRISim</h1>
      <span class="sp"></span>
      <a href="index.html">← Home</a>
      <span id="whoami" class="whoami" hidden></span>
    </div>
    <div id="root" role="status" aria-live="polite">
      <div class="card"><p class="sub">Loading…</p></div>
    </div>
    <p class="disclaimer">
      MRISim is an educational simulator, not a medical device and not for clinical
      or diagnostic use. Class data is stored to run your course; see
      <a href="https://github.com/ea1188/mrisim" target="_blank" rel="noopener">the project</a> for details.
    </p>
  </main>
  <script src="config.js"></script>
  <script src="auth_url.js"></script>
  <script src="accounts.js"></script>
  <script src="account.js"></script>
</body>
</html>
