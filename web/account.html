<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MRISim — account</title>
  <meta name="description" content="Sign in to run an MRISim class: create a class, share a join code, and track your students' practice." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #050607; color: #dfe5ec; margin: 0;
      font-family: "SF Pro Text", "Segoe UI", "Helvetica Neue", Inter, Arial, sans-serif; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 28px 18px 60px; }
    .top { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
    .top img { width: 34px; height: 34px; }
    .top h1 { font-size: 20px; font-weight: 600; margin: 0; letter-spacing: -0.2px; }
    .top .sp { flex: 1; }
    .top a, .whoami button { color: #6ea7df; text-decoration: none; font-size: 13px;
      background: none; border: none; cursor: pointer; font: inherit; }
    .card { background: #141a21; border: 1px solid #232c36; border-radius: 3px;
      padding: 20px; margin-bottom: 16px; }
    h2 { font-size: 15px; font-weight: 600; margin: 0 0 12px; letter-spacing: -0.1px; }
    p.sub { color: #9aa4b2; font-size: 13px; line-height: 1.5; margin: 0 0 14px; }
    label { display: block; font-size: 12px; color: #9aa4b2; margin: 12px 0 5px; }
    input[type=text], input[type=email] { width: 100%; box-sizing: border-box; background: #0b0f14;
      border: 1px solid #2b3644; color: #dfe5ec; border-radius: 3px; padding: 9px 10px; font: inherit; font-size: 14px; }
    input:focus { outline: none; border-color: #4385cc; }
    .roles { display: flex; gap: 16px; margin-top: 6px; }
    .roles label { display: flex; align-items: center; gap: 6px; margin: 0; color: #dfe5ec; font-size: 13px; cursor: pointer; }
    button.primary { margin-top: 16px; background: #4385cc; color: #081019; border: none; border-radius: 3px;
      padding: 10px 16px; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
    button.primary:hover { background: #6ea7df; }
    button.ghost { background: none; border: 1px solid #2b3644; color: #cdd5df; border-radius: 3px;
      padding: 7px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
    button.ghost:hover { border-color: #3f6f9c; }
    .whoami { display: flex; align-items: center; gap: 10px; font-size: 13px; color: #9aa4b2; }
    .code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 15px;
      letter-spacing: 1px; color: #dfe5ec; background: #0b0f14; border: 1px solid #2b3644;
      border-radius: 3px; padding: 3px 8px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #1e262f; }
    th { color: #838d9c; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
    td.num { font-variant-numeric: tabular-nums; }
    .muted { color: #838d9c; font-size: 12.5px; }
    .msg { font-size: 13px; margin-top: 12px; }
    .msg.ok { color: #6bbf83; } .msg.err { color: #d98a8a; }
    .classhead { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    .classhead .grow { flex: 1; }
    .disclaimer { color: #6b7480; font-size: 11.5px; margin-top: 26px; line-height: 1.5; }
    .disclaimer a { color: #6ea7df; text-decoration: none; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <img src="logo.png" alt="" />
      <h1>MRISim</h1>
      <span class="sp"></span>
      <a href="index.html">← Home</a>
      <span id="whoami" class="whoami" hidden></span>
    </div>
    <div id="root" role="status" aria-live="polite">
      <div class="card"><p class="sub">Loading…</p></div>
    </div>
    <p class="disclaimer">
      MRISim is an educational simulator — not a medical device and not for clinical
      or diagnostic use. Class data is stored to run your course; see
      <a href="https://github.com/ea1188/mrisim" target="_blank" rel="noopener">the project</a> for details.
    </p>
  </main>
  <script src="config.js"></script>
  <script src="accounts.js"></script>
  <script src="account.js"></script>
</body>
</html>
