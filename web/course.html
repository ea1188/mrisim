<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MRISim — guided course</title>
  <meta name="description" content="A guided MRI curriculum: work through each topic and test yourself, with exclusive course material." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #050607; color: #dfe5ec; margin: 0; height: 100%;
      font-family: "SF Pro Text", "Segoe UI", "Helvetica Neue", Inter, Arial, sans-serif; }
    .top { display: flex; align-items: center; gap: 10px; padding: 10px 16px;
      background: #0d1014; border-bottom: 1px solid #1b222a; position: sticky; top: 0; z-index: 10; }
    .top img { width: 30px; height: 30px; }
    .top h1 { font-size: 16px; font-weight: 600; margin: 0; letter-spacing: -0.2px; }
    .top .badge { font-size: 10px; letter-spacing: .5px; text-transform: uppercase; color: #6ea7df;
      border: 1px solid #2b3644; border-radius: 2px; padding: 1px 6px; }
    .top .sp { flex: 1; }
    .top a, .top button { color: #6ea7df; text-decoration: none; font: inherit; font-size: 13px;
      background: none; border: none; cursor: pointer; }
    .top .whoami { color: #9aa4b2; font-size: 12.5px; }

    /* Gate screens (sign-in / paywall / notices) */
    .gate { max-width: 520px; margin: 8vh auto; padding: 0 18px; }
    .gate .card { background: #141a21; border: 1px solid #232c36; border-radius: 3px; padding: 24px; }
    .gate h2 { font-size: 18px; margin: 0 0 10px; }
    .gate p { color: #9aa4b2; font-size: 13.5px; line-height: 1.55; margin: 0 0 14px; }
    .gate label { display: block; font-size: 12px; color: #9aa4b2; margin: 12px 0 5px; }
    .gate input { width: 100%; box-sizing: border-box; background: #0b0f14; border: 1px solid #2b3644;
      color: #dfe5ec; border-radius: 3px; padding: 9px 10px; font: inherit; font-size: 14px; }
    .gate input:focus { outline: none; border-color: #4385cc; }
    .btn { margin-top: 14px; background: #4385cc; color: #081019; border: none; border-radius: 3px;
      padding: 10px 16px; font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; }
    .btn:hover { background: #6ea7df; }
    .msg { font-size: 13px; margin-top: 12px; } .msg.ok { color: #6bbf83; } .msg.err { color: #d98a8a; }

    /* Course layout: topic rail + content */
    .course { display: grid; grid-template-columns: 288px 1fr; min-height: calc(100vh - 52px); }
    .rail { border-right: 1px solid #1b222a; padding: 12px 0; overflow-y: auto; }
    .rail .prog { padding: 4px 16px 12px; color: #838d9c; font-size: 11.5px; }
    .rail .bar { height: 4px; background: #1c2027; border-radius: 2px; overflow: hidden; margin: 6px 0 0; }
    .rail .bar > i { display: block; height: 100%; background: #4385cc; }
    .topic { display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
      color: #c4cad2; font: inherit; font-size: 13.5px; padding: 9px 16px; border-left: 2px solid transparent; }
    .topic:hover { background: #12171d; }
    .topic.on { background: #12171d; border-left-color: #4385cc; color: #fff; }
    .topic .tk { color: #6bbf83; font-size: 11px; margin-right: 6px; }

    /* Collapsible table of contents: modules with checkable subsections */
    .mod-h { display: flex; align-items: center; gap: 7px; width: 100%; text-align: left; background: none;
      border: none; cursor: pointer; color: #c4cad2; font: inherit; font-size: 13.5px; padding: 9px 16px;
      border-left: 2px solid transparent; }
    .mod-h:hover { background: #12171d; }
    .mod-h.on { background: #12171d; border-left-color: #4385cc; color: #fff; }
    .mod-h .caret { flex: none; font-size: 9px; color: #6b7684; display: inline-block; transition: transform .12s; }
    .mod-h .caret.open { transform: rotate(90deg); }
    .mod-h .mtk { margin-left: auto; font-size: 11px; color: #7c8794; font-variant-numeric: tabular-nums; }
    .mod-h .mtk.done { color: #6bbf83; }
    .mod-subs { padding: 2px 0 6px; }
    .mod-subs[hidden] { display: none; }
    .sub { display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; background: none;
      border: none; cursor: pointer; color: #9aa4b2; font: inherit; font-size: 12.5px; line-height: 1.35;
      padding: 5px 16px 5px 34px; }
    .sub:hover { background: #12171d; color: #dfe5ec; }
    .sub.done { color: #7f8a97; }
    .sub .box { flex: none; width: 13px; height: 13px; margin-top: 1px; border: 1px solid #3a4552;
      border-radius: 3px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px; line-height: 1; color: #081019; }
    .sub .box.on { background: #4385cc; border-color: #4385cc; }
    .sub .sl { flex: 1; }
    .edu, .sec, .lcard { scroll-margin-top: 62px; }
    .main { padding: 26px 30px 60px; max-width: 760px; }
    .main h2 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.2px; }
    .main .lede { color: #9aa4b2; font-size: 13.5px; margin: 0 0 20px; }
    .sec { margin: 26px 0 0; }
    .sec h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #838d9c; margin: 0 0 10px; }
    .edu { background: #141a21; border: 1px solid #232c36; border-radius: 3px; padding: 16px 18px; margin-bottom: 12px; }
    .edu h4 { margin: 0 0 8px; font-size: 15px; }
    .edu .body { color: #c4cad2; font-size: 13.5px; line-height: 1.6; }
    .edu .body p { margin: 0 0 10px; } .edu .body ul { margin: 6px 0 10px 18px; padding: 0; }
    .keypoints { margin-top: 12px; padding-top: 10px; border-top: 1px solid #1e262f; }
    .keypoints b { color: #9aa4b2; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; display: block; margin-bottom: 6px; }
    .keypoints li { color: #c4cad2; font-size: 13px; margin: 3px 0 3px 18px; }
    .lcard { display: flex; align-items: center; gap: 12px; background: #12171d; border: 1px solid #232c36;
      border-radius: 3px; padding: 12px 14px; margin-bottom: 8px; }
    .lcard .grow { flex: 1; } .lcard .lt { font-size: 14px; } .lcard .lb { color: #838d9c; font-size: 12px; margin-top: 2px; }
    .lcard a { color: #6ea7df; text-decoration: none; font-size: 13px; white-space: nowrap; }
    .lcard a:hover { color: #8fbdec; }
    /* Inline premium quiz */
    .q { background: #141a21; border: 1px solid #232c36; border-radius: 3px; padding: 16px 18px; margin-bottom: 12px; }
    .q .prompt { font-size: 14px; font-weight: 600; margin: 0 0 12px; line-height: 1.4; }
    .q .opt { display: block; width: 100%; text-align: left; background: #0b0f14; border: 1px solid #2b3644;
      color: #dfe5ec; border-radius: 3px; padding: 9px 12px; font: inherit; font-size: 13.5px; margin: 6px 0; cursor: pointer; }
    .q .opt:hover:not(:disabled) { border-color: #3f6f9c; }
    .q .opt.correct { border-color: #3f8f5a; background: #14261a; }
    .q .opt.wrong { border-color: #8f3f3f; background: #261414; }
    .q .fb { font-size: 13px; color: #c4cad2; margin-top: 10px; line-height: 1.5; }
    .quiz-foot { color: #838d9c; font-size: 12.5px; margin-top: 6px; }
    .linkout { color: #6ea7df; text-decoration: none; font-size: 13px; }
    .lcard.done { border-color: #2a4a37; }
    .lcard .lk { color: #6bbf83; font-size: 12px; margin-right: 2px; }
    .lcard button.launch { color: #6ea7df; background: none; border: none; font: inherit; font-size: 13px;
      white-space: nowrap; cursor: pointer; padding: 0; }
    .lcard button.launch:hover { color: #8fbdec; }
    @media (max-width: 780px) { .course { grid-template-columns: 1fr; } .rail { border-right: none; border-bottom: 1px solid #1b222a; } }

    /* Practice exam: rail entry + setup + timed run + review */
    .exam-cta { display: block; width: calc(100% - 24px); margin: 2px 12px 10px; text-align: left;
      background: #152232; border: 1px solid #274763; color: #8fbdec; font: inherit; font-size: 13px;
      font-weight: 600; border-radius: 3px; padding: 9px 12px; cursor: pointer; }
    .exam-cta:hover { border-color: #3f6f9c; color: #bcd8f5; }
    .exam-cta.on { background: #1c3350; border-color: #4385cc; color: #dbe9fa; }
    .exam-cta .ec-sub { display: block; font-weight: 400; font-size: 11px; color: #7c8794; margin-top: 2px; }

    .exam-setup { background: #141a21; border: 1px solid #232c36; border-radius: 3px; padding: 18px; margin-top: 12px; }
    .exam-setup h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .5px; color: #838d9c; margin: 0 0 10px; }
    .exam-lens { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 4px; }
    .exam-len { background: #0b0f14; border: 1px solid #2b3644; color: #dfe5ec; border-radius: 3px;
      padding: 8px 16px; font: inherit; font-size: 13px; cursor: pointer; }
    .exam-len:hover { border-color: #3f6f9c; }
    .exam-len.on { background: #1c3350; border-color: #4385cc; color: #fff; }
    .exam-timed { display: flex; align-items: center; gap: 8px; color: #c4cad2; font-size: 13px; margin: 14px 0 2px; cursor: pointer; }
    .exam-timed input { width: auto; }
    .exam-note { color: #838d9c; font-size: 12px; margin: 8px 0 0; }

    .exam-bar { position: sticky; top: 52px; z-index: 5; display: flex; align-items: center; gap: 14px;
      background: #0d1014; border: 1px solid #232c36; border-radius: 3px; padding: 10px 14px; margin-bottom: 16px; }
    .exam-bar .eb-count { color: #c4cad2; font-size: 13px; }
    .exam-bar .eb-timer { color: #8fbdec; font-size: 13px; font-variant-numeric: tabular-nums; }
    .exam-bar .sp { flex: 1; }
    .exam-bar .eb-submit { margin-top: 0; padding: 7px 14px; }

    .exam-q { background: #141a21; border: 1px solid #232c36; border-radius: 3px; padding: 16px 18px; margin-bottom: 12px; }
    .exam-q .eq-num { color: #838d9c; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; margin: 0 0 8px; }
    .exam-q .prompt { font-size: 14px; font-weight: 600; margin: 0 0 12px; line-height: 1.4; }
    .exam-q.miss { border-color: #5a3030; }
    .exam-q .miss-tag { color: #d98a8a; font-size: 10px; margin-left: 8px; border: 1px solid #5a3030; border-radius: 2px; padding: 1px 5px; }
    .exam-q .fb { font-size: 13px; color: #c4cad2; margin-top: 10px; line-height: 1.5; }
    .exam-q .fb.muted { color: #9aa4b2; font-style: italic; }
    .exam-opt { display: block; width: 100%; text-align: left; background: #0b0f14; border: 1px solid #2b3644;
      color: #dfe5ec; border-radius: 3px; padding: 9px 12px; font: inherit; font-size: 13.5px; margin: 6px 0; cursor: pointer; }
    .exam-opt:hover:not(:disabled) { border-color: #3f6f9c; }
    .exam-opt.sel { border-color: #4385cc; background: #132132; }
    .exam-opt.correct { border-color: #3f8f5a; background: #14261a; }
    .exam-opt.wrong { border-color: #8f3f3f; background: #261414; }
    .exam-foot { margin: 18px 0 0; }

    .exam-result { background: #141a21; border: 1px solid #232c36; border-radius: 3px; padding: 18px; margin-bottom: 16px; text-align: center; }
    .exam-result .er-score { font-size: 30px; font-weight: 700; color: #fff; }
    .exam-result .er-pct { font-size: 15px; color: #8fbdec; margin-top: 2px; }
    .exam-result .er-meta { color: #838d9c; font-size: 12px; margin-top: 6px; }
    .exam-result .er-actions { display: flex; gap: 10px; justify-content: center; margin-top: 14px; }
    .exam-result .er-actions .btn { margin-top: 0; }
    .btn.ghost { background: none; border: 1px solid #2b3644; color: #c4cad2; }
    .btn.ghost:hover { border-color: #3f6f9c; background: #12171d; color: #fff; }

    /* Inline lesson overlay: the simulator runs in an iframe here so learners never
       leave the course. Fixed, full-viewport, above the sticky top bar (z-index 10). */
    #lesson-overlay { position: fixed; inset: 0; z-index: 50; background: #050607;
      display: flex; flex-direction: column; }
    #lesson-overlay[hidden] { display: none; }
    #lesson-overlay .obar { display: flex; align-items: center; gap: 10px; padding: 8px 14px;
      background: #0d1014; border-bottom: 1px solid #1b222a; flex: 0 0 auto; }
    #lesson-overlay .obar .otitle { font-size: 13.5px; font-weight: 600; color: #dfe5ec; }
    #lesson-overlay .obar .osub { font-size: 11.5px; color: #838d9c; }
    #lesson-overlay .obar .sp { flex: 1; }
    #lesson-overlay .obar button { color: #c4cad2; background: #171d25; border: 1px solid #2b3644;
      border-radius: 3px; padding: 6px 12px; font: inherit; font-size: 12.5px; cursor: pointer; }
    #lesson-overlay .obar button:hover { border-color: #3f6f9c; color: #fff; }
    #lesson-overlay iframe { flex: 1 1 auto; width: 100%; border: 0; background: #050607; }
  </style>
</head>
<body>
  <div class="top">
    <img src="logo.png" alt="" /><h1>MRISim</h1><span class="badge">Course</span>
    <span class="sp"></span>
    <a href="reference.html">Reference</a>
    <a href="index.html">← Home</a>
    <span id="whoami" class="whoami" hidden></span>
  </div>
  <div id="course-root" role="status" aria-live="polite">
    <div class="gate"><div class="card"><p>Loading…</p></div></div>
  </div>

  <!-- Inline lesson runner: the simulator loads here (as an iframe) when a learner
       opens a lesson, so they stay on the course page. Populated by course.js. -->
  <div id="lesson-overlay" hidden role="dialog" aria-modal="true" aria-label="Lesson">
    <div class="obar">
      <div>
        <div class="otitle" id="lesson-title"></div>
        <div class="osub">Interactive lesson · runs the live simulator</div>
      </div>
      <span class="sp"></span>
      <button type="button" id="lesson-close">✕ Close lesson</button>
    </div>
    <iframe id="lesson-frame" title="Lesson" allow="fullscreen"></iframe>
  </div>

  <script src="config.js"></script>
  <script src="accounts.js"></script>
  <script src="course.js"></script>
</body>
</html>
