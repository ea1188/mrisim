<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MRISim — guided course</title>
  <meta name="description" content="A guided MRI curriculum: work through each topic and test yourself, with exclusive course material." />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="theme.css" />
  <style>
    /* Course app: consumes the shared design system (theme.css). Every selector here is a
       hook course.js renders into — restyled, never renamed. */
    /* min-height (not height:100%) so body grows to the full document height. A fixed
       viewport-height body would clamp the sticky header's containing block, releasing it
       after one screen of scroll (header + reading bar would detach and scroll away). */
    body { min-height: 100vh; }

    /* Top app bar (blurred, sticky) */
    .top { display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 clamp(14px,4vw,22px);
      background: rgba(7,9,12,.8); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line);
      position: fixed; top: 0; left: 0; right: 0; z-index: 10; }
    .top img { width: 26px; height: 26px; }
    .top h1 { font-size: 16px; font-weight: 700; margin: 0; letter-spacing: -0.3px; }
    .top .badge { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--accent); border: 1px solid var(--line-2); border-radius: 2px; padding: 2px 9px; }
    .top .sp { flex: 1; }
    .top a, .top button { color: var(--muted); text-decoration: none; font: inherit; font-size: 13px;
      background: none; border: none; cursor: pointer; transition: color .15s; }
    .top a:hover, .top button:hover { color: var(--text); }
    .top .whoami { color: var(--muted); font-size: 12.5px; }

    /* Gate screens (sign-in / paywall / notices) */
    .gate { max-width: 520px; margin: 8vh auto; padding: 0 18px; }
    .gate .card { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 26px; }
    .gate h2 { font-size: 19px; margin: 0 0 10px; }
    .gate p { color: var(--muted); font-size: 14px; line-height: 1.6; margin: 0 0 14px; }
    .gate label { display: block; font-size: 12px; color: var(--muted); margin: 12px 0 5px; }
    .gate input { width: 100%; box-sizing: border-box; background: var(--bg-2); border: 1px solid var(--line-2);
      color: var(--text); border-radius: 2px; padding: 10px 12px; font: inherit; font-size: 14px; }
    .gate input:focus { outline: none; border-color: var(--accent); }

    /* Local solid-accent button (overrides theme .btn base for bare `.btn` usage in course.js) */
    .btn { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; background: var(--accent);
      color: var(--accent-ink); border: 1px solid transparent; border-radius: 2px; padding: 10px 16px;
      font: inherit; font-weight: 600; font-size: 13px; cursor: pointer; transition: .16s; }
    .btn:hover { background: #7cc0f4; }
    .msg { font-size: 13px; margin-top: 12px; } .msg.ok { color: var(--ok); } .msg.err { color: var(--warn); }

    /* Course layout: topic rail + content */
    /* The header is position:fixed (out of flow), so offset the content by its 56px height.
       .course keeps min-height:calc(100vh - 56px) → 56px offset + that = exactly 100vh. */
    #course-root { padding-top: 56px; }
    .course { display: grid; grid-template-columns: 288px 1fr; min-height: calc(100vh - 56px); }
    .rail { border-right: 1px solid var(--line); padding: 12px 0; overflow-y: auto; }
    .rail .prog { padding: 6px 18px 14px; color: var(--dim); font-size: 11px; font-family: var(--mono); letter-spacing: .04em; }
    .rail .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin: 7px 0 0; }
    .rail .bar > i { display: block; height: 100%; background: var(--accent); }
    .topic { display: block; width: 100%; text-align: left; background: none; border: none; cursor: pointer;
      color: #c4cad2; font: inherit; font-size: 13.5px; padding: 9px 18px; border-left: 2px solid transparent; }
    .topic:hover { background: var(--panel-2); }
    .topic.on { background: var(--panel-2); border-left-color: var(--accent); color: #fff; }
    .topic .tk { color: var(--ok); font-size: 11px; margin-right: 6px; }

    /* Collapsible table of contents: modules with checkable subsections */
    .mod-h { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; background: none;
      border: none; cursor: pointer; color: #c4cad2; font: inherit; font-size: 13.5px; padding: 9px 18px;
      border-left: 2px solid transparent; transition: background .12s; }
    .mod-h:hover { background: var(--panel-2); }
    .mod-h.on { background: var(--panel-2); border-left-color: var(--accent); color: #fff; }
    .mod-h .caret { flex: none; font-size: 9px; color: var(--dim); display: inline-block; transition: transform .12s; }
    .mod-h .caret.open { transform: rotate(90deg); }
    .mod-h .mtk { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
    .mod-h .mtk.done { color: var(--ok); }
    .mod-subs { display: grid; grid-template-rows: 0fr; }
    .mod-subs.open { grid-template-rows: 1fr; }
    .mod-subs > .ms-inner { overflow: hidden; min-height: 0; padding: 2px 0 6px; }
    .sub { display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left; background: none;
      border: none; cursor: pointer; color: var(--muted); font: inherit; font-size: 12.5px; line-height: 1.35;
      padding: 5px 18px 5px 36px; transition: background .12s, color .12s; }
    .sub:hover { background: var(--panel-2); color: var(--text); }
    .sub.done { color: #7f8a97; }
    .sub .box { flex: none; width: 14px; height: 14px; margin-top: 1px; border: 1px solid var(--line-2);
      border-radius: 2px; display: inline-flex; align-items: center; justify-content: center;
      font-size: 9px; line-height: 1; color: var(--accent-ink); }
    .sub .box.on { background: var(--accent); border-color: var(--accent); }
    .sub .sl { flex: 1; }

    .edu, .sec, .lcard { scroll-margin-top: 72px; }
    .main { padding: 30px clamp(20px,4vw,38px) 64px; max-width: 780px; }
    .main h2 { font-size: 23px; margin: 0 0 4px; }
    .main .lede { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
    .sec { margin: 30px 0 0; }
    .sec h3 { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .14em;
      color: var(--dim); margin: 0 0 12px; }
    .edu { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 18px 20px; margin-bottom: 12px; }
    .edu h4 { margin: 0 0 8px; font-size: 15.5px; }
    .edu .body { color: #c4cad2; font-size: 13.5px; line-height: 1.65; }
    .edu .body p { margin: 0 0 10px; } .edu .body ul { margin: 6px 0 10px 18px; padding: 0; }
    /* The four content blocks share a color-coded left accent so a module reads as a scannable structure */
    .keypoints, .edu-worked, .edu-hooks, .edu-traps { margin-top: 16px; padding: 1px 0 1px 13px; border-left: 2px solid var(--line-2); }
    .keypoints { border-left-color: var(--accent); }
    .edu-worked { border-left-color: var(--ok); }
    .edu-hooks { border-left-color: var(--muted); }
    .edu-traps { border-left-color: var(--warn); }
    .keypoints b, .edu-worked h5, .edu-hooks h5, .edu-traps h5 { margin: 0 0 7px; font-family: var(--mono); font-size: 10.5px;
      text-transform: uppercase; letter-spacing: .12em; font-weight: 600; display: block; }
    .keypoints b { color: var(--accent); }
    .edu-worked h5 { color: var(--ok); }
    .edu-hooks h5 { color: var(--muted); }
    .edu-traps h5 { color: var(--warn); }
    .keypoints ul, .edu-hooks ul, .edu-traps ul { margin: 0; padding-left: 18px; color: #c4cad2; font-size: 13px; line-height: 1.6; }
    .keypoints li, .edu-hooks li, .edu-traps li { margin: 0 0 5px; }
    .edu-worked .body { color: #c4cad2; font-size: 13.5px; line-height: 1.65; }
    .edu-foot { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
    .edu.read { border-color: #2a4a37; }
    .edu .edu-read-tag { color: var(--ok); font-size: 12px; font-family: var(--mono); letter-spacing: .04em; }
    .diagram { margin: 14px 0 4px; padding: 12px; border: 1px solid var(--line-2); border-radius: 8px; background: rgba(255,255,255,.02); }
    .diag-cap { font-size: 12px; color: var(--muted); margin: 0 0 8px; }
    .diag-svg { width: 100%; max-width: 420px; height: auto; display: block; }
    .diag-axis { stroke: var(--line-2); stroke-width: 1; }
    .diag-axtext { fill: var(--muted); font-size: 9px; }
    .diag-curve { fill: none; stroke: var(--accent); stroke-width: 2; }
    .diag-curve.alt { stroke: var(--warn); }
    .diag-curve.pd { stroke: var(--muted); }
    .diag-marker { stroke: var(--ok); stroke-width: 1; stroke-dasharray: 3 3; }
    .diag-controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
    .diag-select { background: rgba(255,255,255,.03); color: inherit; border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 12px; }
    .diag-btn { background: transparent; color: var(--muted); border: 1px solid var(--line-2); border-radius: 6px; padding: 4px 8px; font: inherit; font-size: 12px; cursor: pointer; }
    .diag-btn:hover { color: inherit; }
    .diag-btn.on { color: #061018; background: var(--accent); border-color: var(--accent); }
    .diag-readout { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 16px; }
    @media (prefers-reduced-motion: no-preference) {
      .diag-btn { transition: background .15s var(--ease), color .15s var(--ease); }
    }
    .edu .mark-read { background: var(--bg-2); border: 1px solid var(--line-2); color: var(--accent); font: inherit;
      font-size: 12.5px; padding: 6px 12px; border-radius: 2px; cursor: pointer; }
    .edu .mark-read:hover { border-color: var(--accent-deep); }
    .lcard { display: flex; align-items: center; gap: 12px; background: var(--panel); border: 1px solid var(--line);
      border-radius: 2px; padding: 13px 15px; margin-bottom: 8px; transition: border-color .15s, background .15s; }
    .lcard:hover { border-color: var(--accent-deep); background: var(--panel-2); }
    .lcard .grow { flex: 1; } .lcard .lt { font-size: 14px; } .lcard .lb { color: var(--dim); font-size: 12px; margin-top: 2px; }
    .lcard a { color: var(--accent); text-decoration: none; font-size: 13px; white-space: nowrap; }
    .lcard a:hover { color: #8fc6f5; }

    /* Inline premium quiz */
    .q { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 16px 18px; margin-bottom: 12px; }
    .q .prompt { font-size: 14px; font-weight: 600; margin: 0 0 12px; line-height: 1.45; }
    .q .opt { display: block; width: 100%; text-align: left; background: var(--bg-2); border: 1px solid var(--line-2);
      color: var(--text); border-radius: 2px; padding: 10px 12px; font: inherit; font-size: 13.5px; margin: 6px 0; cursor: pointer; transition: border-color .14s; }
    .q .opt:hover:not(:disabled) { border-color: var(--accent-deep); }
    .q .opt.correct { border-color: #3f8f5a; background: #14261a; }
    .q .opt.wrong { border-color: #8f3f3f; background: #261414; }
    .q .fb { font-size: 13px; color: #c4cad2; margin-top: 10px; line-height: 1.55; }
    .q-img { display: block; width: 320px; max-width: 100%; margin: 0 0 12px; border: 1px solid var(--line); border-radius: 2px; background: #000; }
    .q-credit { font-size: 11px; color: var(--muted, #8a94a7); margin: 4px 0 8px; }
    .mchk .mchk-intro, .mchk .mchk-status { font-size: 13px; color: #c4cad2; line-height: 1.6; margin: 0 0 12px; }
    .mchk .mchk-status.pass { color: var(--ok); }
    .mchk .mchk-status.fail { color: var(--warn); }
    .mchk .mq-num { font-family: var(--mono); font-size: 11px; color: var(--dim); margin: 0 0 8px; letter-spacing: .04em; }
    .mchk .opt.sel { border-color: var(--accent-deep); background: var(--panel-2); }
    .mchk-score { display: flex; align-items: baseline; gap: 12px; padding: 14px 0 8px; }
    .mchk-score .ms-pct { font-size: 32px; font-weight: 680; line-height: 1; letter-spacing: -1px; }
    .mchk-score.pass .ms-pct { color: var(--ok); }
    .mchk-score.fail .ms-pct { color: var(--warn); }
    .mchk-score .ms-line { font-size: 13px; color: var(--muted); }
    .mchk-rev-h { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--dim); margin: 18px 0 10px; }
    .mchk-actions { display: flex; gap: 10px; margin-top: 14px; }
    .quiz-foot { color: var(--dim); font-size: 12.5px; margin-top: 6px; }
    .linkout { color: var(--accent); text-decoration: none; font-size: 13px; }
    .fb .reflink { display: inline-block; margin-top: 8px; }
    .lcard.done { border-color: #2a4a37; }
    .lcard .lk { color: var(--ok); font-size: 12px; margin-right: 2px; }
    .lcard button.launch { color: var(--accent); background: none; border: none; font: inherit; font-size: 13px;
      white-space: nowrap; cursor: pointer; padding: 0; }
    .lcard button.launch:hover { color: #8fc6f5; }

    /* --- interaction polish: press feedback, answer reveal, focus ring, motion system --- */
    :root { --ease: cubic-bezier(.2,.6,.2,1); }
    .opt, .exam-opt { position: relative; }
    .q .opt, .mchk .opt, .exam-opt { padding-right: 30px; }
    .opt.correct::after, .exam-opt.correct::after { content: "\2713"; position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      color: var(--ok); font-weight: 700; font-size: 14px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    /* Reading-progress bar: fills as the window scrolls through the current view (sits under the app bar) */
    /* Sits at the sticky header's bottom edge (inside .top) so it moves with the header and
       never detaches to float over the body text. */
    #readbar { position: absolute; bottom: -1px; left: 0; right: 0; height: 2px; z-index: 9; pointer-events: none; }
    #readbar > i { display: block; height: 100%; width: 0; background: var(--accent); }
    @media (prefers-reduced-motion: no-preference) {
      #readbar > i { transition: width .1s linear; }
      .mod-subs { transition: grid-template-rows .22s var(--ease); }
      .btn, .opt, .exam-opt, .lcard, .topic, .sub, .mod-h, .exam-cta, .exam-len, .mark-read, .plan-row {
        transition: border-color .15s var(--ease), background-color .15s var(--ease), color .15s var(--ease), transform .07s var(--ease); }
      .btn:active, .opt:active:not(:disabled), .exam-opt:active:not(:disabled), .lcard:active, .topic:active,
      .sub:active, .mod-h:active, .exam-cta:active, .exam-len:active, .mark-read:active, .plan-row:active { transform: translateY(1px); }
      @keyframes optreveal { from { transform: scale(.985); } to { transform: none; } }
      @keyframes checkpop { 0% { opacity: 0; transform: translateY(-50%) scale(.3); } 60% { opacity: 1; transform: translateY(-50%) scale(1.15); } 100% { transform: translateY(-50%) scale(1); } }
      @keyframes fbin { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
      .opt.correct { animation: optreveal .26s var(--ease); }
      .opt.correct::after, .exam-opt.correct::after { animation: checkpop .34s var(--ease); }
      .q .fb { animation: fbin .26s var(--ease); }
    }
    @media (max-width: 780px) { .course { grid-template-columns: 1fr; } .rail { border-right: none; border-bottom: 1px solid var(--line); } }

    /* Practice exam: rail entry + setup + timed run + review */
    .exam-cta { display: block; width: calc(100% - 24px); margin: 4px 12px 12px; text-align: left;
      background: var(--panel); border: 1px solid var(--line-2); color: var(--accent); font: inherit; font-size: 13px;
      font-weight: 600; border-radius: 2px; padding: 11px 13px; cursor: pointer; transition: .15s; }
    .exam-cta:hover { border-color: var(--accent-deep); background: var(--panel-2); }
    .exam-cta.on { background: #12212f; border-color: var(--accent); color: #dbe9fa; }
    .exam-cta .ec-sub { display: block; font-weight: 400; font-size: 11px; color: var(--dim); margin-top: 3px; }

    .exam-setup { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 20px; margin-top: 12px; }
    .exam-setup h3 { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .14em; color: var(--dim); margin: 0 0 12px; }
    .exam-lens { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 4px; }
    .exam-len { background: var(--bg-2); border: 1px solid var(--line-2); color: var(--text); border-radius: 2px;
      padding: 8px 16px; font: inherit; font-size: 13px; cursor: pointer; transition: border-color .14s; }
    .exam-len:hover { border-color: var(--accent-deep); }
    .exam-len.on { background: #12212f; border-color: var(--accent); color: #fff; }
    .exam-timed { display: flex; align-items: center; gap: 8px; color: #c4cad2; font-size: 13px; margin: 14px 0 2px; cursor: pointer; }
    .exam-timed input { width: auto; }
    .exam-note { color: var(--dim); font-size: 12px; margin: 8px 0 0; }

    .exam-bar { position: sticky; top: 56px; z-index: 5; display: flex; align-items: center; gap: 14px;
      background: rgba(13,17,22,.92); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 2px;
      padding: 10px 14px; margin-bottom: 16px; }
    .exam-bar .eb-count { color: #c4cad2; font-size: 13px; }
    .exam-bar .eb-timer { color: var(--accent); font-family: var(--mono); font-size: 13px; font-variant-numeric: tabular-nums; }
    .exam-bar .sp { flex: 1; }
    .exam-bar .eb-submit { margin-top: 0; padding: 8px 15px; }

    .exam-q { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 16px 18px; margin-bottom: 12px; }
    .exam-q .eq-num { font-family: var(--mono); color: var(--dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: .14em; margin: 0 0 8px; }
    .exam-q .prompt { font-size: 14px; font-weight: 600; margin: 0 0 12px; line-height: 1.45; }
    .exam-q.miss { border-color: #5a3030; }
    .exam-q .miss-tag { color: var(--warn); font-family: var(--mono); font-size: 10px; margin-left: 8px; border: 1px solid #5a3030; border-radius: 2px; padding: 1px 7px; }
    .exam-q .fb { font-size: 13px; color: #c4cad2; margin-top: 10px; line-height: 1.55; }
    .exam-q .fb.muted { color: var(--muted); font-style: italic; }
    .exam-opt { display: block; width: 100%; text-align: left; background: var(--bg-2); border: 1px solid var(--line-2);
      color: var(--text); border-radius: 2px; padding: 10px 12px; font: inherit; font-size: 13.5px; margin: 6px 0; cursor: pointer; transition: border-color .14s; }
    .exam-opt:hover:not(:disabled) { border-color: var(--accent-deep); }
    .exam-opt.sel { border-color: var(--accent); background: #12212f; }
    .exam-opt.correct { border-color: #3f8f5a; background: #14261a; }
    .exam-opt.wrong { border-color: #8f3f3f; background: #261414; }
    .exam-foot { margin: 18px 0 0; }

    .exam-result { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 22px; margin-bottom: 16px; text-align: center; }
    .exam-result .er-score { font-size: 32px; font-weight: 700; color: #fff; letter-spacing: -.02em; }
    .exam-result .er-pct { font-size: 15px; color: var(--accent); margin-top: 2px; }
    .exam-result .er-meta { color: var(--dim); font-family: var(--mono); font-size: 12px; margin-top: 8px; }
    .exam-result .er-actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }
    .exam-result .er-actions .btn { margin-top: 0; }

    .diag-card { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 18px 20px; margin: 14px 0 0; }
    .diag-card h3 { margin: 0 0 6px; font-size: 15px; }
    .diag-card p { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 12px; }
    .diag-note { color: var(--dim); font-size: 12px; margin: 12px 0 0; }
    .diag-retake { background: none; border: none; color: var(--accent); font: inherit; font-size: 12px; text-decoration: underline; cursor: pointer; padding: 0; }
    .diag-grid { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
    .diag-row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px 12px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 2px; }
    .diag-row .dr-title { font-size: 13.5px; }
    .diag-row .dr-acc { font-family: var(--mono); font-size: 11px; color: var(--dim); }
    .diag-row .bar { grid-column: 1 / -1; }
    .plan-list { display: flex; flex-direction: column; gap: 6px; margin: 6px 0 12px; }
    .plan-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; width: 100%; text-align: left;
      background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 2px; padding: 9px 12px; color: #c4cad2; font: inherit; font-size: 13px; cursor: pointer; }
    .plan-row:hover { border-color: var(--accent-deep); }
    .plan-row .pr-act { color: var(--accent); font-size: 12px; white-space: nowrap; }
    .plan-target { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 13px; color: var(--muted); }
    .plan-target input { background: var(--bg-2); border: 1px solid var(--line-2); border-radius: 2px; color: var(--text); font: inherit; font-size: 13px; padding: 5px 8px; }
    .plan-pace { color: var(--dim); font-size: 12.5px; margin: 0; }
    .btn.ghost { background: none; border: 1px solid var(--line-2); color: #c4cad2; }
    .btn.ghost:hover { border-color: var(--accent-deep); background: var(--panel-2); color: #fff; }

    /* Inline lesson overlay: the simulator runs in an iframe here so learners never
       leave the course. Fixed, full-viewport, above the sticky top bar (z-index 10). */
    #lesson-overlay { position: fixed; inset: 0; z-index: 50; background: var(--bg);
      display: flex; flex-direction: column; }
    #lesson-overlay[hidden] { display: none; }
    #lesson-overlay .obar { display: flex; align-items: center; gap: 10px; padding: 9px 14px;
      background: var(--bg-2); border-bottom: 1px solid var(--line); flex: 0 0 auto; }
    #lesson-overlay .obar .otitle { font-size: 13.5px; font-weight: 600; color: var(--text); }
    #lesson-overlay .obar .osub { font-size: 11.5px; color: var(--dim); }
    #lesson-overlay .obar .sp { flex: 1; }
    #lesson-overlay .obar button { color: #c4cad2; background: var(--panel-2); border: 1px solid var(--line-2);
      border-radius: 2px; padding: 7px 13px; font: inherit; font-size: 12.5px; cursor: pointer; transition: .15s; }
    #lesson-overlay .obar button:hover { border-color: var(--accent-deep); color: #fff; }
    #lesson-overlay .obar a#lesson-fullsim { color: var(--accent); background: none; border: 1px solid var(--line-2);
      border-radius: 2px; padding: 7px 12px; font: inherit; font-size: 12.5px; text-decoration: none; transition: .15s; }
    #lesson-overlay .obar a#lesson-fullsim:hover { border-color: var(--accent); background: var(--panel-2); }
    #lesson-body { flex: 1 1 auto; overflow-y: auto; padding: clamp(16px,3vw,34px); }
    /* Lesson viewer: acquired image beside the teaching box (stacks on narrow screens) */
    .lv { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: clamp(16px,3vw,32px);
      max-width: 1000px; margin: 0 auto; align-items: start; }
    .lv-img { background: #000; border: 1px solid var(--line); border-radius: 2px; overflow: hidden;
      display: flex; align-items: center; justify-content: center; }
    .lv-img img { display: block; width: 100%; height: auto; }
    .lv-text { display: flex; flex-direction: column; }
    .lv-text.solo { grid-column: 1 / -1; max-width: 680px; margin: 0 auto; }
    .lv-step { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
      color: var(--accent); margin: 0 0 12px; }
    .lv-box { color: var(--text); font-size: 15px; line-height: 1.65; }
    .lv-box b { color: #fff; }
    .lv-nav { display: flex; gap: 10px; margin-top: 26px; }
    .lv-nav .btn { margin-top: 0; }
    .lv-nav .btn.ghost { background: none; color: var(--muted); border: 1px solid var(--line-2); }
    .lv-nav .btn.ghost:hover:not(:disabled) { border-color: var(--accent-deep); color: var(--text); }
    .lv-nav .btn:disabled { opacity: .4; cursor: default; }
    @media (max-width: 720px) { .lv { grid-template-columns: 1fr; } }

    /* Overview rail entry */
    .overview-cta { display: block; width: calc(100% - 24px); margin: 4px 12px 8px; text-align: left;
      background: var(--panel); border: 1px solid var(--line-2); border-radius: 2px; color: var(--muted);
      font: inherit; font-size: 13px; font-weight: 600; padding: 9px 12px; cursor: pointer; transition: .15s; }
    .overview-cta:hover { border-color: var(--accent-deep); background: var(--panel-2); color: var(--text); }
    .overview-cta.on { background: #12212f; border-color: var(--accent); color: #dbe9fa; }

    /* Exam-readiness dashboard (course home) */
    .main .eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase;
      color: var(--accent); margin: 0 0 8px; }
    .ready { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding: 20px; margin: 6px 0 16px; }
    .ready .ready-num { font-size: 40px; font-weight: 680; line-height: 1; letter-spacing: -1px; }
    .ready .ready-band { font-size: 13px; color: var(--muted); margin: 4px 0 12px; }
    .bar.wide { height: 8px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .bar.wide > i { display: block; height: 100%; background: var(--accent); }
    .ready .ready-sub { font-family: var(--mono); font-size: 11.5px; color: var(--dim); margin-top: 10px; letter-spacing: .03em; }
    .study-next { display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      width: 100%; box-sizing: border-box; margin: 0 0 10px; }
    .study-next .sn-why { font-weight: 400; font-size: 11.5px; color: var(--accent-ink); opacity: .85; }
    .ghost-cta { background: none; color: var(--accent); border: 1px solid var(--line-2); margin: 0 0 8px; }
    .ghost-cta:hover { background: var(--panel-2); border-color: var(--accent-deep); }
    .ready-h { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: .14em;
      color: var(--dim); margin: 26px 0 10px; }
    .ready-grid { display: flex; flex-direction: column; gap: 6px; }
    .ready-row { display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 12px;
      text-align: left; background: var(--panel); border: 1px solid var(--line); border-left-width: 3px;
      border-radius: 2px; padding: 11px 14px; cursor: pointer; font: inherit; color: var(--text); transition: background .12s; }
    .ready-row:hover { background: var(--panel-2); }
    .ready-row .rr-title { font-size: 13.5px; font-weight: 550; }
    .ready-row .rr-read, .ready-row .rr-quiz { font-family: var(--mono); font-size: 11px; color: var(--dim);
      font-variant-numeric: tabular-nums; }
    .ready-row .rr-chip { font-size: 10px; font-family: var(--mono); letter-spacing: .08em; text-transform: uppercase;
      padding: 3px 8px; border-radius: 2px; border: 1px solid var(--line-2); color: var(--muted); white-space: nowrap; }
    .ready-row.progress { border-left-color: var(--accent); }
    .ready-row.progress .rr-chip { color: var(--accent); border-color: var(--accent-deep); }
    .ready-row.review { border-left-color: var(--warn); }
    .ready-row.review .rr-chip { color: var(--warn); border-color: var(--warn); }
    .ready-row.mastered { border-left-color: var(--ok); }
    .ready-row.mastered .rr-chip { color: var(--ok); border-color: var(--ok); }
    .complete-panel { background: var(--panel); border: 1px solid var(--ok); border-radius: 2px; padding: 20px 22px; margin: 14px 0; }
    .complete-panel .cp-eyebrow { font-family: var(--mono); font-size: 11px; letter-spacing: .16em; text-transform: uppercase; color: var(--ok); margin: 0 0 6px; }
    .complete-panel .cp-title { margin: 0 0 8px; font-size: 17px; }
    .complete-panel .cp-sub { color: var(--muted); font-size: 13.5px; line-height: 1.6; margin: 0 0 8px; }
    .complete-panel .cp-note { color: var(--dim); font-size: 12.5px; margin: 0; }
    @media (max-width: 560px) {
      .ready-row { grid-template-columns: 1fr auto; }
      .ready-row .rr-read, .ready-row .rr-quiz { display: none; }
    }
    .abadge { display: inline-block; margin-left: 8px; padding: 1px 6px; border-radius: 2px;
      background: var(--accent, #1f6feb); color: var(--accent-ink, #fff); font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.04em; vertical-align: middle; }
    .abadge .due { text-transform: none; letter-spacing: 0; opacity: 0.85; margin-left: 4px; }
    .blueprint { margin: 30px 0 8px; }
    .bp-h { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase;
      letter-spacing: .12em; color: var(--dim); margin: 0 0 14px; }
    .bp-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 20px; margin-bottom: 8px; }
    .bp-num { font-size: 30px; font-weight: 650; color: var(--text); line-height: 1;
      font-variant-numeric: tabular-nums; }
    .bp-lbl { font-size: 12px; color: var(--muted); margin-top: 5px; }
    .bp-cov { font-size: 12.5px; color: var(--muted); }
    .bp-row { padding: 13px 0; border-top: 1px solid var(--line); }
    .bp-head + .bp-row { border-top: none; }
    .bp-row-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 8px; }
    .bp-name { font-size: 14px; color: var(--text); }
    .bp-chip { font-family: var(--mono); font-size: 10px; letter-spacing: .04em; color: var(--accent);
      border: 1px solid var(--line-2); border-radius: 2px; padding: 2px 7px; white-space: nowrap; }
    .bp-acc { margin-left: auto; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .bp-acc.none { color: var(--dim); }
    .blueprint .bar { height: 6px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .blueprint .bar > i { display: block; height: 100%; background: var(--accent); }
    .bp-cov-line { font-size: 11.5px; color: var(--dim); margin-top: 7px; }
    .bp-note { font-size: 11.5px; color: var(--muted); margin-top: 7px; }
  </style>
</head>
